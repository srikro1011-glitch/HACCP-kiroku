<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HACCP記録</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap row">
    <div><div class="store" id="storeName">…</div><div class="sub">HACCP記録</div></div>
    <input type="date" id="date" aria-label="日付">
  </div>
</header>

<main class="wrap stack">
  <section class="card stack">
    <label for="who" class="lbl">入力する人</label>
    <select id="who"></select>
    <input id="whoOther" placeholder="名前を入力" hidden>
  </section>

  <section class="card" id="status" aria-live="polite">今日の入力状況を読み込み中…</section>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="temp" aria-selected="true">温度</button>
    <button type="button" role="tab" data-tab="daily">毎日の衛生</button>
    <button type="button" role="tab" data-tab="health">健康</button>
  </nav>

  <!-- 温度 -->
  <section class="card stack" data-panel="temp">
    <div class="seg" id="slot">
      <button type="button" data-v="朝" aria-pressed="true">朝</button>
      <button type="button" data-v="夕">夕</button>
    </div>
    <div id="fridges" class="stack"></div>
    <button type="button" class="primary" id="saveTemp">温度を記録する</button>
  </section>

  <!-- 毎日の衛生 -->
  <section class="card stack" data-panel="daily" hidden>
    <p class="hint">閉店前に1日1回。できていなければ✕を押して、何があってどうしたかを書いてください。</p>
    <div id="daily" class="stack"></div>
    <button type="button" class="primary" id="saveDaily">毎日の衛生を記録する</button>
  </section>

  <!-- 健康 -->
  <section class="card stack" data-panel="health" hidden>
    <p class="hint">出勤したら自分の分を入れます。当てはまらないものがあれば店長に伝えて、対応を書いてください。</p>
    <div id="health" class="stack"></div>
    <button type="button" class="primary" id="saveHealth">健康チェックを記録する</button>
  </section>

  <p id="msg" class="msg" aria-live="polite"></p>
</main>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const STORE = params.get("store") || "sannomiya";
let fridges = [], slot = "朝";
const $ = id => document.getElementById(id);
const msg = (t, bad) => { $("msg").textContent = t; $("msg").className = "msg" + (bad ? " bad" : " good"); };

$("date").value = jstDate();
try { $("who").dataset.saved = localStorage.getItem("haccp_who") || ""; } catch (e) {}

function who() {
  const v = $("who").value === "__other" ? $("whoOther").value.trim() : $("who").value;
  return v;
}
$("who").addEventListener("change", () => {
  $("whoOther").hidden = $("who").value !== "__other";
  try { localStorage.setItem("haccp_who", $("who").value); } catch (e) {}
});

// タブ
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== b.dataset.tab);
  msg("");
}));
document.querySelectorAll("#slot button").forEach(b => b.addEventListener("click", () => {
  slot = b.dataset.v;
  document.querySelectorAll("#slot button").forEach(x => x.setAttribute("aria-pressed", x === b));
}));

// 基準外・✕のときだけ「対応」欄を出す
function actionBox(id) {
  return `<textarea id="${id}" class="action" placeholder="何があって、どうしたか（例：扉が開いていた→閉めて30分後に再測定 6℃）" hidden></textarea>`;
}

function renderFridges() {
  $("fridges").innerHTML = fridges.map(f => `
    <div class="item">
      <label for="t${f.id}" class="name">${esc(f.name)}<small>${f.kind}・${f.max_temp}℃以下</small></label>
      <div class="tempin"><input type="number" inputmode="decimal" step="0.1" id="t${f.id}"><span>℃</span></div>
      ${actionBox("a" + f.id)}
    </div>`).join("") || `<p class="hint">庫が登録されていません。管理者に伝えてください。</p>`;
  fridges.forEach(f => $("t" + f.id).addEventListener("input", e => {
    const v = parseFloat(e.target.value);
    const bad = !isNaN(v) && v > Number(f.max_temp);
    e.target.closest(".item").classList.toggle("ng", bad);
    $("a" + f.id).hidden = !bad;
  }));
}

function okNg(name, i) {
  return `<div class="seg okng" data-i="${i}">
    <button type="button" data-v="1" aria-pressed="false">○</button>
    <button type="button" data-v="0" aria-pressed="false">✕</button></div>`;
}
function wireOkNg(root) {
  root.querySelectorAll(".okng").forEach(g => g.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    g.dataset.v = b.dataset.v;
    const item = g.closest(".item");
    item.classList.toggle("ng", b.dataset.v === "0");
    const a = item.querySelector(".action"); if (a) a.hidden = b.dataset.v !== "0";
  })));
}

$("daily").innerHTML = DAILY_ITEMS.map((d, i) => `
  <div class="item">
    <div class="row"><div class="name">${esc(d.key)}<small>${esc(d.hint)}</small></div>${okNg(d.key, i)}</div>
    ${actionBox("da" + i)}
  </div>`).join("");
wireOkNg($("daily"));

$("health").innerHTML = HEALTH_ITEMS.map((h, i) => `
  <div class="item"><div class="row"><div class="name">${esc(h)}</div>${okNg(h, i)}</div></div>`).join("")
  + `<textarea id="ha" class="action" placeholder="当てはまらないものがあったとき：店長に伝えた内容と対応（例：手に切り傷→手袋着用、盛り付けのみ担当）" hidden></textarea>`;
wireOkNg($("health"));
$("health").querySelectorAll(".okng").forEach(g => g.addEventListener("click", () => {
  const anyNg = [...$("health").querySelectorAll(".okng")].some(x => x.dataset.v === "0");
  $("ha").hidden = !anyNg;
}));

async function loadStatus() {
  try {
    const s = await sbRpc("today_status", { p_store: STORE, p_date: $("date").value });
    const n = slt => (s.temp.find(t => t.slot === slt) || { n: 0 }).n;
    const total = fridges.length;
    const chip = (label, done) => `<span class="chip ${done ? "done" : "todo"}">${label}${done ? " 済" : " まだ"}</span>`;
    $("status").innerHTML = `<div class="lbl">${$("date").value} の入力状況</div><div class="chips">`
      + chip("温度 朝", total && n("朝") >= total) + chip("温度 夕", total && n("夕") >= total)
      + chip("毎日の衛生", s.daily >= DAILY_ITEMS.length) + `</div>`
      + `<div class="hint">健康チェック済み：${s.health.length ? s.health.map(esc).join("、") : "まだ誰もいません"}</div>`;
  } catch (e) { $("status").textContent = "入力状況を読み込めませんでした"; }
}

async function init() {
  try {
    const [st] = await sbGet(`stores?id=eq.${encodeURIComponent(STORE)}&select=name`);
    $("storeName").textContent = st ? st.name : "店舗が見つかりません";
    fridges = await sbGet(`fridges?store_id=eq.${encodeURIComponent(STORE)}&order=sort`);
    const staff = await sbGet(`staff?store_id=eq.${encodeURIComponent(STORE)}&order=sort&select=name`);
    $("who").innerHTML = `<option value="">選んでください</option>`
      + staff.map(s => `<option>${esc(s.name)}</option>`).join("") + `<option value="__other">リストにない（名前を入力）</option>`;
    const saved = $("who").dataset.saved;
    if (saved && [...$("who").options].some(o => o.value === saved)) $("who").value = saved;
    $("whoOther").hidden = $("who").value !== "__other";
    renderFridges();
    loadStatus();
  } catch (e) {
    $("storeName").textContent = "つながりません";
    msg("データに接続できませんでした。電波を確認して、もう一度開いてください。", true);
  }
}
$("date").addEventListener("change", loadStatus);

function needWho() { if (!who()) { msg("「入力する人」を選んでください。", true); $("who").focus(); return true; } }

$("saveTemp").addEventListener("click", async () => {
  if (needWho()) return;
  const rows = [];
  for (const f of fridges) {
    const raw = $("t" + f.id).value;
    if (raw === "") continue;
    const temp = parseFloat(raw), ok = temp <= Number(f.max_temp), action = $("a" + f.id).value.trim();
    if (!ok && !action) { msg(`${f.name} が基準外です。何をしたかを書いてください。`, true); $("a" + f.id).focus(); return; }
    rows.push({ store_id: STORE, log_date: $("date").value, slot, fridge_id: f.id, temp, ok, action: action || null, staff_name: who() });
  }
  if (!rows.length) { msg("温度を1つ以上入れてください。", true); return; }
  if (rows.length < fridges.length) { msg("まだ入れていない庫があります。全部入れてから記録してください。", true); return; }
  try {
    await sbInsert("temp_logs", rows);
    fridges.forEach(f => { $("t" + f.id).value = ""; $("a" + f.id).value = ""; $("a" + f.id).hidden = true; $("t" + f.id).closest(".item").classList.remove("ng"); });
    msg(`${slot}の温度を記録しました。`); loadStatus();
  } catch (e) { msg("記録できませんでした。もう一度押してください。", true); }
});

function readOkNg(root) { return [...root.querySelectorAll(".okng")].map(g => g.dataset.v); }

$("saveDaily").addEventListener("click", async () => {
  if (needWho()) return;
  const v = readOkNg($("daily"));
  if (v.some(x => x === undefined)) { msg("全部の項目に○か✕を付けてください。", true); return; }
  const rows = [];
  for (let i = 0; i < DAILY_ITEMS.length; i++) {
    const ok = v[i] === "1", action = $("da" + i).value.trim();
    if (!ok && !action) { msg(`「${DAILY_ITEMS[i].key}」が✕です。内容と対応を書いてください。`, true); $("da" + i).focus(); return; }
    rows.push({ store_id: STORE, log_date: $("date").value, item: DAILY_ITEMS[i].key, ok, action: action || null, staff_name: who() });
  }
  try {
    await sbInsert("daily_checks", rows);
    msg("毎日の衛生を記録しました。"); loadStatus();
  } catch (e) { msg("記録できませんでした。もう一度押してください。", true); }
});

$("saveHealth").addEventListener("click", async () => {
  if (needWho()) return;
  const v = readOkNg($("health"));
  if (v.some(x => x === undefined)) { msg("全部の項目に○か✕を付けてください。", true); return; }
  const items = {}; HEALTH_ITEMS.forEach((h, i) => items[h] = v[i] === "1");
  const ok = v.every(x => x === "1"), action = $("ha").value.trim();
  if (!ok && !action) { msg("当てはまらない項目があります。店長に伝えて、対応を書いてください。", true); $("ha").focus(); return; }
  try {
    await sbInsert("health_checks", [{ store_id: STORE, log_date: $("date").value, staff_name: who(), items, ok, action: action || null }]);
    $("health").querySelectorAll(".okng").forEach(g => { delete g.dataset.v; g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", "false")); g.closest(".item").classList.remove("ng"); });
    $("ha").value = ""; $("ha").hidden = true;
    msg(`${who()}さんの健康チェックを記録しました。`); loadStatus();
  } catch (e) { msg("記録できませんでした。もう一度押してください。", true); }
});

init();
</script>
</body>
</html>
